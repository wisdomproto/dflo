compare:
  axes:
    - "生长激素平衡"
    - "性激素与甲状腺管理"
    - "睡眠管理"
    - "体重与营养管理"
    - "刺激身高的运动管理"
    - "体态与骨骼照护"
  bodies:
    - "生长激素并非整天平均分泌。<strong>一夜分泌量的60～70%</strong>集中在最深层的睡眠（慢波睡眠）阶段，尤其是入睡后的头一到两个小时。因此我们不只看激素数值，也会确认让激素真正分泌的条件是否具备。"
    - "性激素让孩子长高，同时也会<strong>使生长板闭合</strong>。青春期提早时，生长板可能比同龄孩子早两到三年闭合，能长高的总时间因而缩短。若另有原因，例如甲状腺功能低下，我们会先处理那个原因。"
    - "<strong>睡得多深</strong>比几点就寝更重要。即使早早躺下，若频繁醒来或睡得浅，仍会错过大部分的分泌。我们会协助在睡前一到两小时远离屏幕，并在昏暗安静的房间固定时间入睡。"
    - "体重过重与过轻<strong>都是</strong>成长的警讯。过多体脂可能通过瘦素等信号提早开启青春期开关，使骨龄超前实际年龄。目标不是少吃，而是在补足蛋白质、钙、维生素D与锌的同时维持适当体重。"
    - "<strong>上下弹跳的动作</strong>——跳绳、篮球、排球——最能有效刺激生长板。每周三到五次、每次30到60分钟，强度以稍微喘气为宜。但过于吃力的训练可能因受伤与压力反而妨碍成长，因此强度会一并调整。"
    - "驼背与头部前倾会压迫脊椎，使孩子看起来比实际矮<strong>1～2厘米，多则3～5厘米</strong>。良好姿势能让生长板受力平均，并促进将养分与生长激素送达的血液循环。我们以伸展与核心肌力训练一并矫正姿势。"

