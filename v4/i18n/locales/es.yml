obesity:
  eyebrow: "02 / Cuidado del crecimiento por obesidad"
  heading_line1: "¿Subir de peso significa más estatura?"
  heading_line2: ""
  heading_accent: "El crecimiento con obesidad"
  heading_line3: " requiere otro enfoque"
  lead: "La obesidad infantil es más que un tema de peso: puede afectar la secreción de hormonas sexuales y el ritmo de la pubertad. El peso, la velocidad de crecimiento y los hábitos de vida deben revisarse en conjunto."
  bmi_panel:
    - img_alt: "Criterios diagnósticos de la obesidad infantil"
  subsection1_eyebrow: "Obesidad infantil y estatura"
  subsection1_heading_line1: "La grasa corporal en niños en crecimiento"
  subsection1_heading_accent: "no siempre se convierte en estatura"
  subsection1_lead: "El exceso de grasa corporal puede interferir con la acción de la hormona de crecimiento y con el avance de la pubertad. El control del peso durante el crecimiento no es una dieta, sino <strong>construir un entorno saludable para crecer</strong>."
  waffle_img_alt: "Alimentos altos en calorías y obesidad infantil"
  subsection2_heading_line1: "La obesidad infantil"
  subsection2_heading_accent: "es distinta de la del adulto"
  subsection2_lead: "Durante el crecimiento pueden cambiar tanto el tamaño como el número de las células grasas, junto con el entorno metabólico. Por eso importa el manejo temprano."
  fatcell_img_alt: "Aumento en el número y el tamaño de las células grasas"
  risks_eyebrow: "Por qué importa la obesidad infantil"
  risks_heading_part1: "¿Por qué "
  risks_heading_accent: "requiere atención?"
  risks:
    - img_alt: "Riesgo de obesidad adulta"
      title: "Obesidad adulta"
      desc: "La obesidad infantil suele continuar como problemas de peso en la adultez."
    - img_alt: "Riesgo de enfermedad metabólica"
      title: "Salud metabólica"
      desc: "Se asocia con problemas de glucosa, presión arterial y piel."
    - img_alt: "Interferencia con el crecimiento en estatura"
      title: "Interferencia en el crecimiento"
      desc: "La grasa corporal y el ritmo de la pubertad pueden alterar el desarrollo de las placas de crecimiento."
    - img_alt: "Impacto emocional"
      title: "Impacto emocional"
      desc: "La preocupación por la imagen corporal puede afectar la confianza y las amistades."
  causes_eyebrow: "¿Por qué está aumentando?"
  causes_heading_accent: "Las causas de la obesidad infantil"
  causes_heading_part2: " — revisadas en conjunto"
  causes:
    - img_alt: "Desequilibrio energético"
      title: "Desequilibrio energético"
      desc: "Cenas tardías, snacks altos en calorías, comidas irregulares"
    - img_alt: "Factores genéticos"
      title: "Factores genéticos"
      desc: "Los antecedentes familiares se consideran junto con el entorno"
    - img_alt: "Factores endocrinos"
      title: "Factores endocrinos"
      desc: "Se revisan el apetito, el metabolismo y el equilibrio hormonal"
    - img_alt: "Factores del estilo de vida"
      title: "Estilo de vida"
      desc: "Menos actividad y patrones de alimentación occidentalizados"
  lifestyle_heading_line1: "Hábitos de vida para aliviar"
  lifestyle_heading_accent: "la obesidad infantil"
  lifestyle_lead: "Equilibramos peso y crecimiento considerando la nutrición y la actividad que un niño en crecimiento necesita."
  lifestyle_cards:
    - img_alt: "Cuidado de la alimentación"
      num: "01 / Alimentación"
      title: "Comidas balanceadas"
      desc: "Reducir snacks altos en calorías; equilibrar proteína, verduras y fibra."
    - img_alt: "Reducir el tiempo de pantalla"
      num: "02 / Hábitos"
      title: "Controlar el tiempo de pantalla"
      desc: "Reducir horas de TV, videojuegos y celular; aumentar la actividad diaria."
    - img_alt: "Actividad física"
      num: "03 / Actividad"
      title: "Movimiento diario"
      desc: "Caminar, subir escaleras y ejercicio ligero mantienen la actividad en la etapa de crecimiento."
    - img_alt: "Cuidado del sueño"
      num: "04 / Sueño"
      title: "Sueño regular"
      desc: "El ritmo del sueño influye tanto en el control del peso como en el entorno de crecimiento."
  cta_label: "¿Le preocupa el peso o el crecimiento de su hijo/a? &nbsp;Consulta 1:1 con un especialista"

precocious:
  eyebrow: "01 / Cuidado de la pubertad precoz"
  heading_line1: "Cuando la pubertad empieza temprano,"
  heading_accent: "el ritmo de las placas de crecimiento"
  heading_line2: " también hay que revisarlo"
  lead: "La pubertad precoz es la aparición de caracteres sexuales secundarios antes de los 8 años en niñas y de los 9 en niños. Una pubertad más rápida también puede acelerar los cambios en las placas de crecimiento, por lo que importa revisar la situación actual."
  chart_panel:
    - ctitle: ""
      csrc: ""
      cunit: ""
      img_alt: "Los casos de pubertad precoz en Corea aumentaron cerca de 1,7 veces en cinco años (109.000 en 2019 a 187.000 en 2023)"
  subsection1_eyebrow: "Pubertad precoz y estatura"
  subsection1_heading_accent: "Cómo la pubertad precoz"
  subsection1_heading_part2: " afecta el crecimiento en estatura"
  subsection1_lead: "Cuando las hormonas sexuales se liberan pronto, la estatura puede parecer crecer rápido por un tiempo. Pero después los cambios en las placas de crecimiento se aceleran, lo que puede afectar la estatura adulta final."
  height_img_alt: "Relación entre la pubertad precoz y la velocidad de crecimiento"
  subsection2_heading_line1: "El cuidado de la pubertad precoz observa"
  subsection2_heading_accent: "el ritmo de la pubertad y la velocidad de crecimiento"
  subsection2_heading_line2: " en conjunto"
  subsection2_lead: "Tratar la pubertad precoz no es solo cuestión de hormonas sexuales: requiere revisar juntos la velocidad de crecimiento, el estado de las placas, el sueño, la nutrición y el peso."
  arrow_img_alt: "Cuidado de la pubertad precoz y manejo del ritmo de crecimiento"
  causes_eyebrow: "¿Por qué tan pronto?"
  causes_heading_accent: "Causas de la pubertad precoz"
  causes_heading_part2: " — revisadas en conjunto"
  causes:
    - img_alt: "Condiciones médicas subyacentes"
      cap_line1: "Alteraciones en el cerebro,"
      cap_line2: "los ovarios o los testículos"
    - img_alt: "Factores alimentarios"
      cap_line1: "Mucha carne o dieta"
      cap_line2: "procesada y alta en grasa"
    - img_alt: "Factor de obesidad"
      cap_line1: "Obesidad ligada a la"
      cap_line2: "actividad hormonal sexual"
    - img_alt: "Disruptores endocrinos"
      cap_line1: "Alta exposición a"
      cap_line2: "disruptores endocrinos"
    - img_alt: "Falta de actividad"
      cap_line1: "Poca actividad física"
      cap_line2: "(videojuegos, TV)"
    - img_alt: "Factor de estrés"
      cap_line1: "Estrés académico o"
      cap_line2: "de estilo de vida"
  cta_label: "¿La pubertad avanza demasiado rápido? &nbsp;Consulta 1:1 con un especialista"

proportion:
  eyebrow: "03 / Cuidado de la proporción corporal"
  heading_line1: "Tan importante como la estatura:"
  heading_accent: "proporciones corporales equilibradas"
  heading_line2: ""
  lead: "Más allá de la estatura, la proporción corporal, la postura y el equilibrio del tren inferior definen la impresión general y la confianza del niño. Durante el crecimiento importa observar la proporción junto con la estatura."
  ratio_img_alt: "Guía de proporción áurea y proporción corporal ideal"
  subsection1_heading_line1: "La pubertad precoz y"
  subsection1_heading_accent: "los cambios en la proporción corporal"
  subsection1_lead: "Cuándo empieza la pubertad y qué tan rápido ocurre el crecimiento moldean el equilibrio entre el tren superior e inferior. Revisar el estado de las placas y la etapa puberal ayuda a manejar la proporción junto con la estatura."
  comparison_img_alt: "Comparación de proporción entre tren superior e inferior"
  quote: "Cuándo comienza la pubertad y cómo se desarrolla el crecimiento pueden moldear las proporciones corporales finales."
  cta_label: "¿Le preocupa el equilibrio corporal? &nbsp;Consulta 1:1 con un especialista"

bodywork:
  eyebrow: "04 / Cuidado de la postura y el desarrollo"
  heading_line1: "La postura y la forma del cuerpo también afectan"
  heading_accent: "el entorno de crecimiento"
  heading_line2: ""
  lead: "Una mala postura, la tensión muscular y fascial, y el desequilibrio de columna o pelvis pueden alterar el equilibrio corporal del niño. Revisamos tanto la forma del cuerpo como el estado del desarrollo mediante diagnóstico y ejercicio."
  diag_subhead: "Diagnóstico — Análisis de radiografía de cuerpo completo"
  xray_img_alt: "Análisis de postura por radiografía de cuerpo completo"
  diag_lead: "Detectamos escoliosis, hiperlordosis lumbar, cabeza adelantada y piernas en O o en X que pueden aparecer durante el crecimiento, y luego orientamos la dirección de cuidado adecuada para su hijo/a."
  problems:
    - img_alt: "Escoliosis"
      cap_strong: "Escoliosis"
      cap_suffix: " · revisión"
    - img_alt: "Hiperlordosis lumbar"
      cap_strong: "Hiperlordosis lumbar"
      cap_suffix: " · revisión"
    - img_alt: "Cabeza adelantada"
      cap_strong: "Cabeza adelantada"
      cap_suffix: " · revisión"
    - img_alt: "Piernas en O y en X"
      cap_strong: "Piernas en O / X"
      cap_suffix: " · revisión"
  treat_subhead: "Tratamiento — Ejercicio que estimula el crecimiento + desarrollo saludable"
  treat_lead: "Nuestro GYM propio ofrece ejercicio 1:1 guiado por entrenador y diseñado para niños en crecimiento. Estiramientos, corrección postural y liberación fascial favorecen una buena postura y equilibrio corporal."
  equip_main_alt: "Equipo de ejercicio para el crecimiento"
  equip_row_alt: "Equipo del programa de ejercicio para el crecimiento"
  cta_label: "¿Le preocupa la postura o el desarrollo? &nbsp;Consulta 1:1 con un especialista"

