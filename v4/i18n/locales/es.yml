calculator:
  page_title: "Calculadora de estatura gratis — Prediga la estatura adulta de su hijo/a | 187 Growth Clinic"
  meta_description: "Calculadora de estatura y predictor de estatura adulta gratis. Ingrese la edad, el sexo y la estatura actual de su hijo/a para estimar su estatura adulta según datos de crecimiento estándar nacionales, en unos 30 segundos."
  iframe_title: "Calculadora de estatura gratis"
  h1: "Calculadora de estatura y predictor de estatura adulta gratis"
  intro: "Use nuestra calculadora de estatura gratis para predecir la estatura adulta de su hijo/a en unos 30 segundos. Ingrese la edad, el sexo y la estatura actual, y el predictor estima la estatura adulta a partir de datos de crecimiento estándar nacionales. Para una evaluación precisa se necesita una radiografía de edad ósea y un análisis de sangre en la clínica."
  how_title: "Cómo funciona la calculadora de estatura"
  how:
    - "Ingrese la fecha de nacimiento, el sexo y la estatura actual de su hijo/a."
    - "La calculadora ubica la estatura actual en un percentil del estándar de crecimiento."
    - "Luego proyecta ese percentil a una estatura adulta estimada."
  faq_title: "Calculadora de estatura — Preguntas frecuentes"
  related_title: "Entender la estatura prevista — lecturas relacionadas"
  faq:
    - q: "¿Qué tan preciso es este predictor de estatura?"
      a: "Ofrece una estimación estadística a partir de datos poblacionales de crecimiento. Una predicción precisa requiere una radiografía de edad ósea y la revisión de un médico, que realizamos en la clínica."
    - q: "¿La calculadora de estatura es gratuita?"
      a: "Sí, la calculadora es totalmente gratuita y no requiere registro."
    - q: "¿Qué estándar de crecimiento utiliza?"
      a: "Usa datos de crecimiento estándar nacionales (Corea, EE. UU./CDC, China, Tailandia, Indonesia), seleccionables por nacionalidad."

