golden:
  eyebrow: "La ventana dorada del tratamiento de crecimiento"
  heading_part1: "¿Cuándo conviene "
  heading_accent: "evaluar el crecimiento?"
  heading_part2: ""
  img_alt: "Momento óptimo de tratamiento para niños y niñas"
  lead: "La eficacia del tratamiento de crecimiento depende del <strong>estado de las placas de crecimiento y del ritmo de la pubertad</strong>. La evaluación puede hacerse de forma independiente al tratamiento: si el ritmo de crecimiento le preocupa, conviene revisar primero la situación actual."

hormone:
  eyebrow: "Cuidado integral del crecimiento"
  heading_line1: "El crecimiento va más allá de la hormona de crecimiento"
  heading_line2: "Cuidamos el crecimiento "
  heading_accent: "desde todos los ángulos"
  lead: "187 Growth Clinic maneja no solo la hormona de crecimiento, sino también <strong>las hormonas sexuales, el sueño, la tiroides, el estrés, el peso, la postura y muchos otros factores</strong>. Identificamos qué está frenando el crecimiento de su hijo/a y diseñamos un plan de crecimiento personalizado."
  solution_img_alt: "Solución integral de crecimiento de 6 pilares de Yonsei Saebom"
  features_heading_line1: "Tres pilares fundamentales"
  features_heading_accent: "para el equilibrio hormonal"
  features:
    - img_alt: "Manejo hormonal"
      num: "01 / Cuidado hormonal"
      title: "Diagnóstico del desequilibrio y cuidado sistemático"
      desc: "Más allá de la hormona de crecimiento, revisamos el equilibrio completo de hormonas sexuales, del sueño, tiroideas y del estrés."
    - img_alt: "Manejo de la pubertad"
      num: "02 / Cuidado de la pubertad"
      title: "Pubertad precoz y caracteres sexuales secundarios"
      desc: "Seguimos el ritmo de la pubertad junto con el estado de las placas de crecimiento para mantener el crecimiento en un buen camino."
    - img_alt: "Obesidad infantil y cuidado del crecimiento"
      num: "03 / Cuidado del peso"
      title: "Control del peso pensando en el crecimiento"
      desc: "Equilibramos la nutrición que un niño en crecimiento necesita mientras manejamos tanto el peso como el crecimiento en estatura."

intro2:
  heading_line1: "Encuentre el camino de cuidado"
  heading_accent: "que se ajusta a su hijo/a"
