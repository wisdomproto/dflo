  h1: "حاسبة الطول المجانية · توقّع الطول عند البلوغ"
  intro: "استخدم حاسبة الطول المجانية لتوقّع طول طفلك عند البلوغ في نحو 30 ثانية. أدخل العمر والجنس والطول الحالي، فتقدّر الأداة الطول اعتمادًا على معايير النمو الوطنية. وللتقييم الدقيق يلزم إجراء أشعة لعمر العظام وتحليل دم في العيادة."
  how_title: "كيف تعمل حاسبة الطول"
