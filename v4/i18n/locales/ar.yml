compare:
  axes:
    - "توازن هرمون النمو"
    - "الهرمونات الجنسية والغدة الدرقية"
    - "إدارة النوم"
    - "الوزن والتغذية"
    - "تمارين محفّزة للطول"
    - "القوام وصحة العظام"
  bodies:
    - "لا يُفرَز هرمون النمو بالتساوي على مدار اليوم. إذ يحدث <strong>60–70% من إفراز الليلة الواحدة</strong> في أعمق مراحل النوم (نوم الموجات البطيئة)، ويتركّز في الساعة الأولى أو الثانية بعد النوم. لذلك لا ننظر إلى مستويات الهرمون وحدها، بل إلى توفّر الظروف التي تسمح بإفرازه فعليًا."
    - "الهرمونات الجنسية تزيد طول الطفل، وفي الوقت نفسه <strong>تُغلق صفائح النمو</strong>. وعند بدء البلوغ مبكرًا قد تُغلق الصفائح قبل الأقران بعامين إلى ثلاثة، فيقصر الوقت المتبقي للنمو. وإن كان وراء بطء النمو سبب آخر، مثل قصور الغدة الدرقية، فإن معالجة ذلك السبب تأتي أولًا."
    - "<strong>عمق النوم</strong> أهم من موعد الخلود إلى الفراش. فالطفل الذي ينام مبكرًا لكنه يستيقظ كثيرًا أو ينام نومًا خفيفًا يفوّت جزءًا كبيرًا من ذلك الإفراز. نعمل على إبعاد الشاشات قبل النوم بساعة إلى ساعتين، والنوم في غرفة مظلمة هادئة في موعد ثابت."
    - "زيادة الوزن ونقصانه <strong>كلاهما</strong> علامة تحذير للنمو. فالدهون الزائدة قد تُشغّل مفتاح البلوغ مبكرًا عبر اللبتين وإشارات أخرى، فيسبق عمر العظام العمر الزمني. والهدف ليس الأكل أقل، بل الحفاظ على وزن مناسب مع تأمين البروتين والكالسيوم وفيتامين د والزنك."
    - "<strong>الحركات القفزية</strong> — نطّ الحبل وكرة السلة والكرة الطائرة — تحفّز صفائح النمو بأكبر فاعلية. من ثلاث إلى خمس مرات أسبوعيًا، و30 إلى 60 دقيقة في المرة، بشدة تجعل الطفل يلهث قليلًا. أما التمرين الأشقّ من طاقته فقد يعيق النمو بالإصابة والتوتر، لذا تُضبط الشدة معه."
    - "انحناء الظهر وتقدّم الرأس يضغطان على العمود الفقري وقد يجعلان الطفل يبدو أقصر بمقدار <strong>1–2 سم، وأحيانًا 3–5 سم</strong>. والقوام السليم يوزّع الحمل بالتساوي على صفائح النمو ويدعم الدورة الدموية التي تحمل إليها الغذاء وهرمون النمو. ونصحّح القوام بالإطالة وتقوية عضلات الجذع."

