    - "ثم تسقط ذلك المئين لتقدير الطول عند البلوغ."
  faq_title: "أسئلة شائعة عن حاسبة الطول"
  related_title: "قراءات ذات صلة — توقّع الطول"
  faq:
    - q: "ما مدى دقة توقّع الطول؟"
      a: "هو تقدير إحصائي من بيانات النمو السكانية. التوقّع الدقيق يتطلب أشعة لعمر العظام وتقييم الطبيب في العيادة."
    - q: "هل الحاسبة مجانية؟"
      a: "مجانية تمامًا ولا تتطلب تسجيلًا."
    - q: "أي معيار نمو تُستخدم؟"
