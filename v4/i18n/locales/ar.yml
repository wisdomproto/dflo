  meta_description: "حاسبة طول مجانية وأداة لتوقّع الطول عند البلوغ. أدخل عمر طفلك وجنسه وطوله الحالي لتقدير طوله عند البلوغ وفق معايير النمو الوطنية خلال نحو 30 ثانية."
