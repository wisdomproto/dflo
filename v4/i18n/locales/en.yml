compare:
  axes:
    - "Growth hormone balance"
    - "Sex hormone & thyroid care"
    - "Sleep management"
    - "Weight & nutrition"
    - "Height-stimulating exercise"
    - "Posture & skeletal care"
  bodies:
    - "Growth hormone is not released evenly through the day. <strong>60&ndash;70% of a night's output</strong> comes during the deepest stage of sleep (slow-wave sleep), concentrated in the first one to two hours after falling asleep. So we look not only at hormone levels but at whether the conditions for releasing that hormone are actually in place."
    - "Sex hormones make a child grow &mdash; and at the same time they <strong>close the growth plates</strong>. When puberty starts early, the plates can close two to three years sooner than in peers, shortening the total time left to grow. And if something else is behind the slow growth, such as an underactive thyroid, that cause is addressed first."
    - "<strong>How deeply a child sleeps</strong> matters more than what time they lie down. A child who goes to bed early but wakes often, or sleeps lightly, still misses much of that release. We work on keeping screens away for one to two hours before bed and settling into a dark, quiet room at a consistent hour."
    - "<strong>Both</strong> excess weight and being underweight are warning signs for growth. Excess body fat can flip the puberty switch early through leptin and other signals, pushing bone age ahead of calendar age. The aim is not simply eating less, but holding a healthy weight while filling in protein, calcium, vitamin D and zinc."
    - "<strong>Up-and-down movement</strong> &mdash; jump rope, basketball, volleyball &mdash; stimulates the growth plates most effectively. Three to five times a week, 30 to 60 minutes, at an intensity that leaves a child slightly out of breath. Training that is too hard for the child can set growth back through injury and stress, so intensity is adjusted alongside everything else."
    - "A rounded back and forward head posture compress the spine and can make a child look <strong>1&ndash;2 cm, sometimes 3&ndash;5 cm shorter</strong> than they are. Good posture spreads load evenly across the growth plates and supports the circulation that carries nutrients and growth hormone to them. We correct posture with stretching and core strengthening."

