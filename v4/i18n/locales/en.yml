      a: "It gives a statistical estimate from population growth data. A precise prediction requires a bone-age X-ray and a doctor's review, which we do at the clinic."
    - q: "Is the height calculator free?"
      a: "Yes — the calculator is completely free and requires no sign-up."
    - q: "Which growth standard does it use?"
      a: "It uses national growth-standard data (Korea, US/CDC, China, Thailand, Indonesia), selectable by nationality."

