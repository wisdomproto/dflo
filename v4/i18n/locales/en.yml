# Growth Hormone Treatment landing page (en-only service page — targets the "growth hormone treatment" commercial query)
ghtx:
  page_title: "Growth Hormone Treatment for Children in Korea | 187 Growth Clinic"
  meta_description: "How growth hormone treatment for children works, who qualifies (GH deficiency, Turner syndrome, being born small for gestational age, and more), how a pediatric growth clinic evaluates it, and what to expect."
  kicker: "Pediatric Growth Clinic · Seoul, Korea"
  h1: "Growth Hormone Treatment for Children"
  hero_sub: "Growth hormone treatment can help children who are not growing as they should — but it is a medical treatment for specific diagnoses, not a shortcut for every short child. Here is what it is, who it is for, and how we evaluate it before treatment ever begins."
  cta_calc: "Check your child's predicted height"
  cta_consult: "Talk to a growth specialist"
  what_title: "What is growth hormone treatment?"
  what_body:
    - "Growth hormone treatment is the medical replacement of growth hormone (GH) in children whose bodies do not produce enough of it, or who have a specific condition that limits growth. It uses a laboratory-made form of the same hormone the pituitary gland normally releases."
    - "Because GH is a protein that would be broken down in the stomach, it is given as a small daily injection under the skin, usually six to seven times a week, and continued for several years until growth is complete. When a child truly needs it, treatment can meaningfully improve growth rate — but it is prescribed only after a diagnosis, not on request."
  who_title: "Who is it for — and who it isn't"
  who_intro: "Growth hormone treatment is approved for children with specific medical conditions that affect growth, including:"
  who_list:
    - t: "Growth hormone deficiency (GHD)"
      d: "The pituitary gland does not release enough growth hormone."
    - t: "Turner syndrome"
      d: "A genetic condition in girls that limits growth."
    - t: "Born small for gestational age (SGA)"
      d: "Children who were very small at birth and did not catch up in height by early childhood."
    - t: "Chronic kidney disease"
      d: "Long-term kidney disease that slows growth."
    - t: "Selected cases of idiopathic short stature (ISS)"
      d: "Marked short stature with no identified cause, evaluated case by case."
  who_note: "Importantly, most short children do not have any of these conditions. Many are simply following a familial (inherited) short-stature pattern or are late bloomers who will catch up. Growth hormone is generally not effective for a child with a normal hormone level who is simply on the shorter side — which is exactly why a proper evaluation comes first."
  process_title: "How we evaluate — before any treatment"
  process_intro: "A diagnosis is never made from a single number. We work through several steps to understand whether treatment is appropriate for your child."
  process_steps:
    - t: "Growth assessment"
      d: "We plot height and weight on the growth chart and look at growth speed over time — the trend matters more than today's height."
    - t: "Bone-age X-ray"
      d: "A hand and wrist X-ray shows skeletal maturity and how much growth potential remains."
    - t: "Blood tests"
      d: "IGF-1, thyroid function, and general health markers help identify or rule out causes."
    - t: "Growth hormone stimulation test"
      d: "Because GH is released in pulses, medication is used to prompt release and blood is drawn several times to measure the response."
    - t: "Individualized plan and monitoring"
      d: "If treatment is appropriate, it is tailored to your child and reviewed regularly to track growth and adjust as needed."
  safety_title: "Safety and what to expect"
  safety_body:
    - "Growth hormone treatment is generally well tolerated. Reported effects are usually mild — such as temporary soreness at the injection site, occasional joint or muscle aches, or small changes in blood sugar — and children are monitored throughout treatment to catch anything early."
    - "The first year often shows the fastest response, with growth speed increasing noticeably compared with before treatment. Results vary from child to child and depend heavily on starting early, while the growth plates are still open. Because outcomes and risks differ by case, every treatment decision is made by a specialist based on the test results."
  trust_title: "Who cares for your child"
  trust_body: "Growth care at our clinic is led by a hormone and child-growth specialist with 15 years of clinical experience, using an integrated view of growth hormone alongside thyroid, sex hormones, nutrition, and sleep."
  cases_body: "See how real children progressed through structured growth care (non-identifying)."
  cases_link: "View treatment cases →"
  faq_title: "Frequently asked questions"
  faq:
    - q: "Will growth hormone make any short child taller?"
      a: "No. Growth hormone treatment is intended for children with a diagnosed condition such as GH deficiency, Turner syndrome, or being born small for gestational age. For a child with normal hormone levels who is simply on the shorter side, it is generally not effective. That is why testing and diagnosis always come first."
    - q: "How is it given, and for how long?"
      a: "It is given as a small daily injection under the skin, usually six to seven days a week, and continued for several years — typically until growth is nearly complete in late puberty. The plan is reviewed regularly to track progress."
    - q: "Is growth hormone treatment safe?"
      a: "For approved indications and under medical supervision, it is generally well tolerated, with mostly mild and monitored side effects. A specialist weighs the benefits and risks for your child individually and follows up throughout treatment."
    - q: "What is the best age to start?"
      a: "There is no single right age, but earlier is generally better because treatment works while the growth plates are still open. A bone-age X-ray helps a specialist judge how much growth potential remains and whether starting now is appropriate."
  related_title: "Learn more"
  related:
    - href: "/en/blog/growth-hormone-child-height/"
      title: "What is growth hormone, and why it matters for height"
    - href: "/en/blog/growth-hormone-deficiency-children/"
      title: "Growth hormone deficiency: symptoms, diagnosis, and treatment"
    - href: "/en/blog/growth-hormone-therapy-side-effects-children/"
      title: "Growth hormone therapy side effects, fact-checked"
    - href: "/en/blog/growth-hormone-in-korea-who-gets-it/"
      title: "Growth hormone in Korea: who actually gets prescribed it"
  cta_title: "Not sure if your child needs an evaluation?"
  cta_body: "Start with a free predicted-height check, or ask us directly about your child's growth."
  disclaimer: "This page provides general educational information and is not a diagnosis. Whether growth hormone treatment is appropriate is determined by a specialist based on examination and testing."

