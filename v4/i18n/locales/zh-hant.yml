  subsection2_heading_accent: "青春期速度與生長速度"
  subsection2_heading_line2: ""
  subsection2_lead: "治療性早熟不只是處理性荷爾蒙——還需要一併檢視生長速度、生長板狀態、睡眠、營養與體重。"
  arrow_img_alt: "性早熟照護與生長速度管理"
