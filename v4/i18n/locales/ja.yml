compare:
  axes:
    - "成長ホルモンのバランス"
    - "性ホルモン・甲状腺の管理"
    - "睡眠の管理"
    - "体重・栄養の管理"
    - "身長を促す運動の管理"
    - "姿勢・骨格のケア"
  bodies:
    - "成長ホルモンは一日中同じ量が出るわけではありません。<strong>一晩の分泌量の60〜70%</strong>が最も深い眠り（徐波睡眠）の段階に集中し、とくに寝入ってから1〜2時間に多く出ます。ですから数値だけでなく、そのホルモンが実際に出られる条件まで一緒に確認します。"
    - "性ホルモンは身長を伸ばすと同時に、<strong>成長板を閉じる</strong>働きもします。思春期が早く始まると、成長板が同年代より2〜3年早く閉じ、伸びられる期間そのものが短くなります。甲状腺機能の低下など別の原因があるなら、まずその原因から解決するのが順番です。"
    - "何時に横になるかより<strong>どれだけ深く眠るか</strong>が大切です。早く寝ても何度も起きたり浅い眠りでは、ホルモンは十分に出ません。就寝の1〜2時間前は画面を遠ざけ、暗く静かな寝室で毎日同じ時刻に眠る習慣を一緒につくります。"
    - "肥満も低体重も<strong>どちらも</strong>成長には赤信号です。過剰な体脂肪はレプチンなどを介して思春期のスイッチを早く入れ、骨年齢を先に進めます。単に食べる量を減らすのではなく、たんぱく質・カルシウム・ビタミンD・亜鉛を満たしながら適正体重を保てるよう支えます。"
    - "縄跳び・バスケットボール・バレーボールのように<strong>上下に跳ぶ動き</strong>が成長板を効果的に刺激します。週3〜5回、1回30〜60分、少し息が上がる程度が適当です。ただし子どもに負担が大きすぎる運動はけがやストレスでかえって成長を妨げるため、強度を一緒に調整します。"
    - "猫背やストレートネックは背骨を圧迫し、実際の身長より<strong>1〜2cm、多い場合は3〜5cm</strong>低く見せます。正しい姿勢は成長板にかかる圧力を均等に分散し、栄養と成長ホルモンを運ぶ血流を助けます。ストレッチと体幹の筋力運動で姿勢も一緒に整えます。"

