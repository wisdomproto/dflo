<!DOCTYPE html>
<html lang="{{meta.lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{seo_head}}
<link rel="stylesheet" href="/_shell.css">
<style>
  .post-container { max-width: 740px; margin: 0 auto; padding: 24px 24px calc(88px + env(safe-area-inset-bottom)); }
  .post-header { padding: 32px 0 24px; border-bottom: 1px solid var(--shell-hairline); }
  .post-title { font-size: 28px; font-weight: 900; color: var(--shell-ink); letter-spacing: -0.6px; line-height: 1.3; }
  .post-meta { font-size: 13px; color: var(--shell-muted); margin-top: 12px; }
  .post-author { font-weight: 700; color: var(--shell-body); text-decoration: none; }
  .post-author:hover { text-decoration: underline; }
  .post-body { padding: 28px 0; font-size: 16px; line-height: 1.85; color: var(--shell-body); }
  .post-body img { max-width: 100%; height: auto; display: block; margin: 24px 0; border-radius: 8px; }
  /* 글 끝 전환 CTA — 차가운 블로그 독자에게 저마찰 진입(무료 측정)을 1차로, 상담을 2차로.
     측정 결과 화면이 다시 상담을 유도하므로 측정→상담 퍼널이 자연 연결된다. */
  .post-cta { margin: 40px 0; padding: 28px 24px; background: var(--shell-page-bg); text-align: center; border-radius: 12px; }
  .post-cta .cta-lead { font-size: 16px; font-weight: 800; color: var(--shell-ink); margin-bottom: 16px; letter-spacing: -0.3px; }
  .post-cta-actions { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 0 auto; }
  .post-cta-measure {
    display: block; padding: 15px 24px; background: var(--shell-brand); color: #fff;
    text-decoration: none; font-weight: 800; border-radius: 12px; font-size: 15.5px;
  }
  .post-cta-consult {
    display: block; padding: 13px 24px; background: {{messenger.color_bg}}; color: {{messenger.color_fg}};
    text-decoration: none; font-weight: 700; border-radius: 12px; font-size: 14.5px;
  }
  .post-references { margin: 32px 0 0; padding-top: 20px; border-top: 1px solid var(--shell-hairline); }
  .post-references-title { font-size: 18px; font-weight: 800; color: var(--shell-ink); margin-bottom: 10px; }
  .post-references-list { font-size: 13px; line-height: 1.7; color: var(--shell-muted); padding-left: 20px; }
  .post-references-list a { color: var(--shell-ink); text-decoration: underline; }
  @media (min-width: 640px) { .post-title { font-size: 36px; } }
</style>
</head>
<body data-page="blog-post">
<div class="post-container">
  <header class="post-header">
    <h1 class="post-title">{{post.title}}</h1>
    <div class="post-meta"><a class="post-author" href="/{{meta.lang}}/author.html" rel="author">{{post.author_byline}}</a> · {{post.published_at_display}}</div>
  </header>
  <article class="post-body">
    {{post.body_html}}
  </article>
  {{post.references_html}}
  <div class="post-cta">
    <p class="cta-lead">{{cta_global.bottom_sub}}</p>
    <div class="post-cta-actions">
      <a class="post-cta-measure" href="/{{meta.lang}}/calculator.html"
         data-source="blog_post_measure">{{cta_global.bottom_measure_label}}</a>
      <a class="post-cta-consult" href="{{messenger.url}}" target="_blank" rel="noopener"
         data-source="blog_post" data-channel="{{messenger.channel}}">{{cta_global.bottom_label}}</a>
    </div>
  </div>
</div>
<script>
  // shell 누락 시 _shell.js 의 t() 가 전부 한국어 기본값으로 폴백해(로고 alt·하단 네비 라벨·상담 시트
  // 문구) 영어 글에 한글 메뉴가 뜬다 — 링크는 locale 로 맞는데 라벨만 한글이라 더 눈에 띈다.
  window.__I18N__ = { locale: "{{meta.lang}}", channel: "{{messenger.channel}}", messenger: {{messenger_json}}, consultChannels: {{consult_json}}, page_type: "blog", hasBlog: {{has_blog}}, aiServer: "{{ai_server}}", shell: {{shell_json}} };
</script>
<script src="/_shell.js"></script>
</body>
</html>
