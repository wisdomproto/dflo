<!DOCTYPE html>
<html lang="{{meta.lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{seo_head}}
<link rel="stylesheet" href="/_shell.css">
<style>
  .blog-wrap { max-width: 1120px; margin: 0 auto; padding: 92px 20px 88px; }
  @media (max-width: 640px) { .blog-wrap { padding: 76px 16px 64px; } }

  /* ===== Hero ===== */
  .blog-hero { text-align: center; margin-bottom: 46px; }
  .blog-hero .kicker {
    display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--shell-brand);
    background: var(--shell-brand-soft); padding: 6px 15px; border-radius: 999px; margin-bottom: 18px;
  }
  .blog-hero h1 {
    font-size: clamp(28px, 5.2vw, 42px); font-weight: 900; letter-spacing: -0.02em;
    line-height: 1.18; color: var(--shell-ink);
  }
  .blog-hero .hero-rule {
    width: 46px; height: 4px; border-radius: 4px; margin: 20px auto 0;
    background: linear-gradient(90deg, var(--shell-brand), var(--shell-kakao));
  }

  /* ===== Grid ===== */
  .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px; }

  .post-card {
    background: #fff; border: 1px solid var(--shell-hairline); border-radius: 18px; overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .post-card a { display: flex; flex-direction: column; height: 100%; color: inherit; text-decoration: none; }
  .post-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(46, 26, 72, .14); border-color: transparent; }

  .thumb {
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, var(--shell-brand), var(--shell-brand-deep));
    background-size: cover; background-position: center;
  }

  .pc-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .pc-body h2 {
    font-size: 18px; font-weight: 800; line-height: 1.42; letter-spacing: -0.01em; color: var(--shell-ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pc-body .desc {
    font-size: 14px; line-height: 1.66; color: var(--shell-body);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pc-body .meta {
    margin-top: auto; padding-top: 4px; font-size: 12.5px; color: var(--shell-muted);
    display: flex; align-items: center; gap: 7px;
  }
  .pc-body .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--shell-brand); }
</style>
</head>
<body data-page="blog-index">
<div class="blog-wrap">
  <header class="blog-hero">
    <span class="kicker">187 GROWUP</span>
    <h1>{{blog.index_heading}}</h1>
    <div class="hero-rule"></div>
  </header>
  <div class="post-grid">
    {{#each posts}}
    <article class="post-card">
      <a href="/{{lang}}/blog/{{slug}}/">
        <div class="thumb" style="{{thumb_style}}"></div>
        <div class="pc-body">
          <h2>{{title}}</h2>
          <p class="desc">{{meta_description}}</p>
          <div class="meta"><span class="dot"></span>{{published_at_display}}</div>
        </div>
      </a>
    </article>
    {{/each}}
  </div>
</div>
<script src="/_shell.js"></script>
</body>
</html>
