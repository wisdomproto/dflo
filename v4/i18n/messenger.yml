_channels:
  whatsapp: &whatsapp
    channel: whatsapp
    url: "https://wa.me/821066932838?text=Hi%2C%20I%20would%20like%20a%20growth%20consultation%20for%20my%20child."
    label: "WhatsApp"
    color_bg: "#25D366"
    color_fg: "#FFFFFF"
  line: &line
    channel: line
    url: "https://line.me/R/ti/p/%40894qhqtu"
    label: "LINE"
    color_bg: "#06C755"
    color_fg: "#FFFFFF"
  kakao: &kakao
    channel: kakao
    url: "https://pf.kakao.com/_mxbWxfX"
    label: "KakaoTalk"
    color_bg: "#FAE100"
    color_fg: "#3C1E1E"

