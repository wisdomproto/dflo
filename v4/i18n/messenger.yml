# 상담 채널 정의(앵커) — 아래 각 언어의 consult_channels 가 이걸 참조한다.
# 계정은 전 언어 공통(같은 WhatsApp/LINE/카카오 채널) 이라 URL 은 여기 한 곳에만 둔다.
_channels:
  whatsapp: &whatsapp
    channel: whatsapp
    url: "https://wa.me/821066932838?text=Hi%2C%20I%20would%20like%20a%20growth%20consultation%20for%20my%20child."
    label: "WhatsApp"
    color_bg: "#25D366"
    color_fg: "#FFFFFF"
  line: &line
    channel: line
    url: "https://line.me/R/ti/p/%40894qhqtu"
    label: "LINE"
    color_bg: "#06C755"
    color_fg: "#FFFFFF"
  kakao: &kakao
    channel: kakao
    url: "https://pf.kakao.com/_mxbWxfX"
    label: "KakaoTalk"
    color_bg: "#FAE100"
    color_fg: "#3C1E1E"

