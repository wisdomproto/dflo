    url: "https://line.me/R/ti/p/%40894qhqtu"
    label: "LINE"
    color_bg: "#06C755"
    color_fg: "#FFFFFF"
  kakao: &kakao
    channel: kakao
    url: "https://pf.kakao.com/_mxbWxfX"
    label: "KakaoTalk"
    color_bg: "#FAE100"
    color_fg: "#3C1E1E"

