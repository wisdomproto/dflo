ch05:
  label: "우리가 하는 것"
  title: "주사 한 대가 아니라 다섯 축을 함께 봅니다"
  lead: "아이마다 자라지 못하는 이유가 다릅니다. 어느 축이 막혀 있는지 먼저 찾고, 필요한 축만 조정합니다."
  axes:
    - { k: "호르몬", v: "성장호르몬 · 성호르몬 · 갑상선 — 아이마다 다르게" }
