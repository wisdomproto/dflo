  callout: "현지에서 X-ray를 미리 보내 주신 경우 상담 시간이 더 짧아집니다."

ch09:
  label: "시작한 뒤"
  title: "귀국하신 뒤에도 진료는 이어집니다"
  items:
    - { when: "6개월", h: "약 수령", d: "방문하신 날 6개월치를 받아 가십니다." }
