    - { when: "6~12개월", h: "정기 검진", d: "한국 방문 또는 현지 X-ray·혈액검사 전송으로 갈음합니다." }
  callout: "방학마다 한 번씩 오시는 분들이 많습니다. 그 사이는 화상으로 이어집니다."

