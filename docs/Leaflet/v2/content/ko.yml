    - { k: "저서", v: "《우리 아이 키 성장 바이블》" }
  quote: "“유전은 바꿀 수 없지만 영양·수면·운동·스트레스는 조절할 수 있습니다.”"
  quote_src: "— 《우리 아이 키 성장 바이블》"

