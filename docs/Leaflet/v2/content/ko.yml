  title: "성장클리닉 해외 환자 안내"
  lead: "한국에 오기 전에 무엇을 준비하고, 와서 무엇을 하고, 그 다음 어떻게 이어지는지."

ch02:
  label: "병원 개요"
  title: "아이의 키 하나만 보는 성장 전문 클리닉입니다"
  body: "187 성장클리닉은 연세새봄의원이 운영하는 소아·청소년 성장 진료 부문입니다. 호르몬 검사와 치료, 생활 관리, 운동·체형 교정을 한 곳에서 이어서 봅니다."
  facts:
    - { k: "설립", v: "2010년" }
    - { k: "위치", v: "서울 강남" }
    - { k: "진료", v: "소아 성장 · 호르몬" }
    - { k: "모병원", v: "연세새봄의원" }
  callout: "해외에서 문의하시는 부모를 위한 절차를 따로 두고 있습니다. 영문 소견서 발급, 현지 검사 활용, 화상 상담으로 한국 방문 전에 대부분을 진행합니다."

