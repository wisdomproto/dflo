  closing: "치료 여부와 방법은 검사 결과와 진료를 바탕으로 결정합니다. 모든 아이에게 같은 방법을 적용하지 않습니다."

ch12:
  label: "자주 묻는 질문"
  title: "부모님들이 많이 물으시는 것"
  qa:
    - q: "한국에 가지 않고 시작할 수 있습니까?"
      a: "문의부터 화상 상담까지는 현지에서 가능합니다. 치료 시작 여부는 상담 후 판단합니다."
    - q: "한국에 가면 며칠 걸립니까?"
      a: "검사와 상담은 당일 하루에 마치도록 준비합니다."
    - q: "현지에서 찍은 X-ray를 써도 됩니까?"
      a: "가능합니다. 영문 소견서에 촬영 조건을 적어 보내 드립니다."
    - q: "우리 아이 나이가 맞습니까?"
      a: "달력 나이보다 뼈나이와 성장판 상태가 기준입니다. X-ray로 확인합니다."
    - q: "치료는 주사 하나뿐입니까?"
      a: "아닙니다. 호르몬·염증·수면·영양·운동 다섯 축 중 필요한 것을 함께 봅니다."
    - q: "돌아간 뒤 약은 어떻게 받습니까?"
      a: "6개월치를 가져가시고, 이후분은 거주지로 보내 드립니다."

