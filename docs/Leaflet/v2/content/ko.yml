    - { k: "수면", v: "성장호르몬이 나오는 시간을 확보" }
    - { k: "영양 · 식욕", v: "먹은 것이 실제로 흡수되도록" }
    - { k: "운동 · 자세", v: "성장판 자극과 체형 교정" }
  stats:
