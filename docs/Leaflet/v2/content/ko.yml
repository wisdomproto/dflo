    - { n: "97%", l: "희망키 도달 비율" }
  footnote: "문헌상 표준 치료 기간은 평균 5년입니다. 결과는 아이마다 다를 수 있습니다."

ch06:
  label: "어떤 아이에게 필요한가"
  title: "이 중 하나라도 해당되면 한 번 확인해 보시기를 권합니다"
  signs:
    - { big: "연 4cm 미만", d: "1년 동안 자란 키가 4cm에 못 미칩니다." }
    - { big: "또래보다 10cm", d: "같은 나이 아이들 평균보다 10cm 이상 작습니다." }
    - { big: "빠른 사춘기", d: "2차 성징이 또래보다 이르게 나타납니다. 뼈나이가 앞서 있을 수 있습니다." }
  callout: "성장판이 닫히기 전까지가 조절할 수 있는 기간입니다. 해당 여부는 검사로 확인합니다."

ch07:
  label: "해외에서 시작하는 법"
  title: "한국에 오기 전에 여기까지 진행됩니다"
  steps:
    - h: "문의"
      d: "아이의 나이, 현재 키, 최근 1년 성장 속도를 알려주십시오."
    - h: "영문 소견서 발급"
      d: "현지 병원에 제출할 영문 소견서를 보내 드립니다. 어떤 검사를 요청해야 하는지 적혀 있습니다."
    - h: "현지에서 X-ray"
      d: "거주하시는 나라에서 손목 X-ray를 촬영해 보내 주시면 됩니다. 이 단계를 위해 한국에 오실 필요는 없습니다."
    - h: "화상 상담"
      d: "원장이 뼈나이와 성장 곡선을 함께 보며 설명합니다. 한국 방문이 필요한지도 이때 판단합니다."
  callout: "1~4단계는 모두 현지에서 가능합니다."

ch08:
  label: "한국에 오면"
  title: "검사부터 상담까지 당일 하루에 끝납니다"
  lead: "여러 날에 나눠 오실 필요가 없도록 한 건물에서 순서대로 진행합니다."
  order:
    - { n: "01", d: "손목 X-ray · 뼈나이 확인" }
    - { n: "02", d: "혈액검사 · 호르몬 수치" }
    - { n: "03", d: "신체 계측 · 체성분" }
    - { n: "04", d: "원장 상담 · 치료 계획 설명" }
    - { n: "05", d: "처방 · 약 수령 · 투여 교육" }
  callout: "현지에서 X-ray를 미리 보내 주신 경우 상담 시간이 더 짧아집니다."

ch09:
  label: "시작한 뒤"
  title: "돌아가신 뒤에도 진료는 이어집니다"
  items:
    - { when: "6개월", h: "약 수령", d: "방문하신 날 6개월치를 받아 가십니다." }
    - { when: "우편", h: "추가 약 발송", d: "이후 필요한 약은 거주지로 보내 드립니다." }
    - { when: "매월", h: "화상 상담", d: "키 변화와 컨디션을 확인하고 필요하면 조정합니다." }
    - { when: "6~12개월", h: "정기 검진", d: "한국 방문 또는 현지 X-ray·혈액검사 전송으로 갈음합니다." }
  callout: "방학마다 한 번씩 오시는 분들이 많습니다. 그 사이는 화상으로 이어집니다."

ch10:
  label: "치료 사례"
  title: "진료실에서 만난 아이들"
  cases:
    - { tag: "성조숙증 · 비만", from: "162.9", to: "185.8", unit: "cm 예상", d: "뼈나이가 4년 앞서 있던 9세" }
    - { tag: "부모 키가 작은 경우", from: "171.2", to: "182.2", unit: "cm 예상", d: "유전 한계 170cm — 아빠 키를 넘어 성장 중" }
    - { tag: "여아 · 성조숙증", from: "153.8", to: "165.3", unit: "cm 예상", d: "미국에서 한국까지 찾아온 남매" }
    - { tag: "성장이 느린 아이", from: "167.0", to: "183.6", unit: "cm 예상", d: "일본에서 방학마다" }
  disclaimer: "가명 사례입니다. 수치는 초진 시점과 이후 시점의 예상키이며, 결과는 아이마다 다를 수 있습니다."

ch11:
  label: "부작용과 안전"
  title: "시작 전에 확인하는 것들"
  items:
    - { h: "사전 혈액검사", d: "간·신장 기능, 갑상선, 혈당을 먼저 확인합니다." }
    - { h: "치료 중 정기 재검", d: "일정 주기로 다시 검사해 수치 변화를 봅니다." }
    - { h: "알려진 이상반응", d: "주사 부위 반응, 일시적인 두통이나 부종 등이 보고되어 있습니다. 대부분 경미하며 확인되면 조정합니다." }
    - { h: "중단 기준", d: "이상이 확인되면 즉시 중단하거나 방법을 바꿉니다." }
  closing: "치료 여부와 방법은 검사 결과와 진료를 바탕으로 결정합니다. 모든 아이에게 같은 방법을 적용하지 않습니다."

ch12:
  label: "자주 묻는 질문"
  title: "부모님들이 많이 물으시는 것"
  qa:
    - q: "한국에 가지 않고 시작할 수 있습니까?"
      a: "문의부터 화상 상담까지는 현지에서 가능합니다. 치료 시작 여부는 상담 후 판단합니다."
    - q: "한국에 가면 며칠 걸립니까?"
      a: "검사와 상담은 당일 하루에 마치도록 준비합니다."
    - q: "현지에서 찍은 X-ray를 써도 됩니까?"
      a: "가능합니다. 영문 소견서에 촬영 조건을 적어 보내 드립니다."
    - q: "우리 아이 나이가 맞습니까?"
      a: "달력 나이보다 뼈나이와 성장판 상태가 기준입니다. X-ray로 확인합니다."
    - q: "치료는 주사 하나뿐입니까?"
      a: "아닙니다. 호르몬·염증·수면·영양·운동 다섯 축 중 필요한 것을 함께 봅니다."
    - q: "돌아간 뒤 약은 어떻게 받습니까?"
      a: "6개월치를 가져가시고, 이후분은 거주지로 보내 드립니다."

